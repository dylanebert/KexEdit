name: test
on: [push, pull_request]

jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun check
      - run: bun run typecheck
      - name: Cheap contracts
        run: bun run test --path-ignore-patterns '**/*.gpu.test.ts'
      - name: Software Vulkan host
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
          icd=$(find /usr/share/vulkan/icd.d -name '*lvp*' -print -quit)
          test -n "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
      - name: Headless Dawn draws
        run: bun test src/view.gpu.test.ts
      - run: bunx playwright install --with-deps chromium
      - name: Built page
        run: bunx playwright test --workers=1
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: page-failure
          path: test-results
