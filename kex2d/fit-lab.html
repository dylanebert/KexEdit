<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <title>kex2d — geo→force fit</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            html,
            body {
                background: #0e0d0c;
                color: #f0ece8;
                font-family: "Outfit", system-ui, sans-serif;
                -webkit-font-smoothing: antialiased;
            }
            #lab {
                display: flex;
                flex-wrap: wrap;
                gap: 18px;
                padding: 22px;
                align-items: flex-start;
            }
            .panel {
                background: #17140f;
                border: 1px solid #2b261e;
                border-radius: 8px;
                padding: 14px 16px 16px;
            }
            .panel h2 {
                font-size: 14px;
                font-weight: 600;
                margin-bottom: 2px;
            }
            .panel p {
                font-size: 11px;
                color: #9a9188;
                margin-bottom: 10px;
                max-width: 620px;
                line-height: 1.4;
            }
            .panel code {
                font-family: "JetBrains Mono", monospace;
                color: #cdbd9a;
            }
            .panel.wide {
                flex-basis: 100%;
            }
            .controls {
                flex-basis: 100%;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .row {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            select,
            button {
                font-family: "Outfit", system-ui, sans-serif;
                font-size: 12px;
                color: #f0ece8;
                background: #17140f;
                border: 1px solid #2b261e;
                border-radius: 5px;
                padding: 5px 10px;
                cursor: pointer;
            }
            button:active {
                background: #221d15;
            }
            input[type="range"] {
                flex: 1;
                max-width: 620px;
                accent-color: #e0a24a;
            }
            .scrub {
                flex: 0 0 auto;
                width: 620px;
            }
            button:disabled {
                color: #6f675e;
                cursor: default;
            }
            .check {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                cursor: pointer;
            }
            /* the pipeline strip: one segment per phase, sized by its frame count, so the
               scrub bar below it reads as recover → refine → polish → quantize at a glance.
               The refine phase is the exception — it expands into one chip per structural
               decision, since WHICH decisions the loop made is the thing worth seeing. */
            .phases {
                display: flex;
                gap: 3px;
                width: 620px;
                max-width: 100%;
            }
            /* grow by frame count, but never below the label: a one-frame phase still
               says its name. Proportion is the secondary read, legibility the first. */
            .phases span {
                flex-basis: auto;
                flex-shrink: 0;
                padding: 2px 6px;
                background: #17140f;
                border: 1px solid #2b261e;
                border-radius: 3px;
                color: #6f675e;
                font-family: "JetBrains Mono", monospace;
                font-size: 10px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                cursor: pointer;
            }
            .phases span.on {
                color: #f0ece8;
                background: #221d15;
                border-color: #e0a24a;
            }
            /* one refine decision. Colored by what it did: a split grows the mesh (gold, the
               working register), a prune shrinks it (blue), a corner breaks a key (red), a
               stall is a rejected trial (faint), and the two terminal kinds are red. */
            .phases span.ev {
                flex-grow: 0;
                min-width: 16px;
                padding: 2px 3px;
                text-align: center;
            }
            .phases span.split {
                color: #e0a24a;
            }
            .phases span.prune {
                color: #5aa0d0;
            }
            .phases span.corner,
            .phases span.budget,
            .phases span.diverged {
                color: #d06a5a;
            }
            .phases span.stall {
                color: #6f675e;
            }
            .mono {
                font-family: "JetBrains Mono", monospace;
                font-size: 11px;
                color: #9a9188;
                white-space: pre;
            }
            .mono.err {
                color: #d06a5a;
            }
            table {
                border-collapse: collapse;
                font-family: "JetBrains Mono", monospace;
                font-size: 11px;
            }
            th {
                color: #9a9188;
                font-weight: 500;
                text-align: right;
                padding: 3px 10px;
                border-bottom: 1px solid #2b261e;
            }
            th:first-child,
            td:first-child {
                text-align: left;
            }
            td {
                text-align: right;
                padding: 3px 10px;
                color: #cdbd9a;
            }
            tr.sel td {
                color: #f0ece8;
                background: #221d15;
            }
        </style>
    </head>
    <body>
        <div id="lab"></div>
        <script type="module" src="./src/fitlab.ts"></script>
    </body>
</html>
